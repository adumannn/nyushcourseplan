name: ingest-reviews

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Run review ingestion
        run: npm run ingest:reviews
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVIEW_DOC_ID: ${{ secrets.REVIEW_DOC_ID }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}   # optional repo variable; code defaults to gemini-2.5-pro when empty
          REVIEW_CATALOG_SLICES: ${{ vars.REVIEW_CATALOG_SLICES }}   # optional; code defaults to 4 when empty
